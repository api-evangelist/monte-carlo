description: >-
  Binds each published Monte Carlo MCP tool to the REST/GraphQL surface behind it. Monte Carlo's technical
  overview states the MCP server executes every call under the user's identity against the GraphQL API
  (https://docs.getmontecarlo.com/docs/monte-carlo-mcp-server-technical-overview), and the only REST
  operation the OpenAPI describes is the single GraphQL transport operation POST /graphql (operationId
  graphql). Every tool therefore binds to that one operation; the specific GraphQL query/mutation each tool
  issues is not published and the live GraphQL + MCP schemas are both auth-gated, so bindings are by
  architecture statement, not by field-level mapping.
surfaces:
  openapi:
    path: openapi/monte-carlo-graph-ql-api-openapi.yml
    operation: POST https://api.getmontecarlo.com/graphql (graphql)
  graphql:
    endpoint: https://api.getmontecarlo.com/graphql
    reference: https://apidocs.getmontecarlo.com/
    gated: true
    note: Introspection requires an API key or OAuth client-credentials token.
  mcp:
    url: https://mcp.getmontecarlo.com/mcp
    gated: true
    note: tools/list returns 401 with an RFC 9728 challenge; tool names from the Claude Connectors Directory and docs.
  push_ingest:
    base: https://integrations.getmontecarlo.com
    operations: [POST /ingest/v1/metadata, POST /ingest/v1/lineage, POST /ingest/v1/querylogs]
    note: Documented REST write API with no OpenAPI in this repo and no MCP tool.
