- aid: monte-carlo:push-ingest-api
  name: Monte Carlo Push Ingest API
  description: >-
    A REST write API for pushing observability data into Monte Carlo from sources its pull-based collectors
    cannot reach. Three endpoints — POST /ingest/v1/metadata (table and view schema, columns, row and
    byte counts, freshness), POST /ingest/v1/lineage (table- and column-level lineage) and POST /ingest/v1/querylogs
    (SQL query history) — each returning 202 Accepted with an invocation_id. Requires a dedicated Ingestion-scoped
    integration key; standard API keys are rejected. Public preview, Enterprise plan or higher.
  humanURL: https://docs.getmontecarlo.com/docs/push-ingest-api
  baseURL: https://integrations.getmontecarlo.com
  tags:
  - Data Observability
  - Data Lineage
  - Ingest
  properties:
  - type: Documentation
    url: https://docs.getmontecarlo.com/docs/push-ingest-api
  - type: ErrorCatalog
    url: errors/monte-carlo-problem-types.yml
- aid: monte-carlo:mcp-server
  name: Monte Carlo MCP Server
  description: >-
    A first-party, fully hosted Model Context Protocol server that gives AI agents direct access to Monte
    Carlo — investigating alerts, exploring assets and lineage, creating and tuning monitors, and evaluating
    AI agent performance. 25 tools listed in the Claude Connectors Directory across three toolsets (default,
    extended, agent_observability) plus four published MCP prompts. Reached over streamable HTTP with OAuth 2.1 and dynamic client registration,
    or with MCP-scoped keys; also shipped as an Anthropic-verified connector in the Claude Connectors
    Directory. Runs on AWS Lambda, stateless, executing under the calling user's Monte Carlo identity.
  humanURL: https://docs.getmontecarlo.com/docs/mcp-server
  baseURL: https://mcp.getmontecarlo.com/mcp
  tags:
  - MCP
