aid: monte-carlo
name: Monte Carlo
description: Monte Carlo is a data and AI observability platform that monitors data warehouses, lakes, and
  pipelines for freshness, volume, schema, and quality anomalies, helping data teams detect, resolve, and
  prevent data downtime across Snowflake, Databricks, BigQuery, Redshift, and other modern data stack tools.
  Monte Carlo exposes a GraphQL API at https://api.getmontecarlo.com/graphql used for programmatic access to
  monitors, incidents, lineage, assets, alerts, custom rules, and lake/metastore integrations, with a
  supporting Python SDK and CLI (pycarlo / montecarlo). Authentication uses an API Key ID and Token pair sent
  via headers.
